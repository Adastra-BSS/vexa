# Multi-step ACR task definition, run by `az acr run`: these five images (plus the join-env
# base) and the Helm chart. This file owns WHAT gets built; the caller owns which commit and
# which channel.
#
# {{.Run.Registry}} is the registry running the task, {{.Run.Commit}} the built sha, and
# {{.Values.channel}} (`--set channel=...`) names everything this run publishes:
#   jana-pilot        the attend-prod branch (.github/workflows/build-attend-prod.yml), the build
#                     every prod and ci stack deploys; its chart goes to helm/vexa.
#   attend-dev-<id>   a developer's own branch, built by Attend's deploy for that developer's
#                     stack; its chart goes to helm-dev/vexa, which no prod or ci deploy reads.
# Build contexts mirror deploy/compose/docker-compose.yml: meeting-api and the bot need
# the repo root (workspace installs), the rest build from their own directory.
version: v1.1.0
steps:
  # An unset channel would publish tags no deploy resolves, and any other name could land
  # beside the prod build; refuse both before anything is built.
  - id: check-channel
    entryPoint: sh
    cmd: >-
      bash:5 -c "case '{{.Values.channel}}' in
      jana-pilot|attend-dev-?*) ;;
      *) echo 'channel must be jana-pilot or attend-dev-<id> (az acr run --set channel=...), got: {{.Values.channel}}' >&2; exit 1;;
      esac"

  # The ACR builder has no BuildKit, so RUN --mount=type=cache lines fail outright.
  # Strip the flag (losing only build-time caching) and fail loudly if any survive.
  - id: strip-cache-mounts
    when: ["check-channel"]
    entryPoint: sh
    cmd: >-
      bash:5 -c "set -e;
      grep -rl -- '--mount=type=cache' core --include='Dockerfile*' | xargs -r sed -i 's/RUN --mount=type=cache[^ ]* /RUN /';
      ! grep -rq -- '--mount=type=cache' core --include='Dockerfile*'"

  # The bot's Dockerfile says FROM vexa/meet-join-env:dev; building the base first on the
  # same docker state makes that resolve locally, exactly like deploy/compose/Makefile.
  - id: join-env
    build: -f core/meetings/modules/join/Dockerfile.env -t vexa/meet-join-env:dev core/meetings/modules/join
    when: ["strip-cache-mounts"]

  - id: gateway
    build: >-
      -f core/gateway/services/gateway/Dockerfile
      -t {{.Run.Registry}}/vexa-gateway:{{.Values.channel}}
      -t {{.Run.Registry}}/vexa-gateway:{{.Values.channel}}-{{.Run.Commit}}
      core/gateway/services/gateway
    when: ["strip-cache-mounts"]
  - id: admin-api
    build: >-
      -f core/identity/services/admin-api/Dockerfile
      -t {{.Run.Registry}}/vexa-admin-api:{{.Values.channel}}
      -t {{.Run.Registry}}/vexa-admin-api:{{.Values.channel}}-{{.Run.Commit}}
      core/identity/services/admin-api
    when: ["strip-cache-mounts"]
  - id: meeting-api
    build: >-
      -f core/meetings/services/meeting-api/Dockerfile
      -t {{.Run.Registry}}/vexa-meeting-api:{{.Values.channel}}
      -t {{.Run.Registry}}/vexa-meeting-api:{{.Values.channel}}-{{.Run.Commit}}
      .
    when: ["strip-cache-mounts"]
  - id: runtime
    build: >-
      -f core/runtime/Dockerfile
      -t {{.Run.Registry}}/vexa-runtime:{{.Values.channel}}
      -t {{.Run.Registry}}/vexa-runtime:{{.Values.channel}}-{{.Run.Commit}}
      core/runtime
    when: ["strip-cache-mounts"]
  - id: bot
    build: >-
      -f core/meetings/services/bot/Dockerfile
      --build-arg VEXA_IMAGE_VERSION={{.Run.Commit}}
      -t {{.Run.Registry}}/vexa-bot:{{.Values.channel}}
      -t {{.Run.Registry}}/vexa-bot:{{.Values.channel}}-{{.Run.Commit}}
      .
    when: ["join-env"]

  - id: push-images
    push:
      - "{{.Run.Registry}}/vexa-gateway:{{.Values.channel}}"
      - "{{.Run.Registry}}/vexa-gateway:{{.Values.channel}}-{{.Run.Commit}}"
      - "{{.Run.Registry}}/vexa-admin-api:{{.Values.channel}}"
      - "{{.Run.Registry}}/vexa-admin-api:{{.Values.channel}}-{{.Run.Commit}}"
      - "{{.Run.Registry}}/vexa-meeting-api:{{.Values.channel}}"
      - "{{.Run.Registry}}/vexa-meeting-api:{{.Values.channel}}-{{.Run.Commit}}"
      - "{{.Run.Registry}}/vexa-runtime:{{.Values.channel}}"
      - "{{.Run.Registry}}/vexa-runtime:{{.Values.channel}}-{{.Run.Commit}}"
      - "{{.Run.Registry}}/vexa-bot:{{.Values.channel}}"
      - "{{.Run.Registry}}/vexa-bot:{{.Values.channel}}-{{.Run.Commit}}"
    when: ["gateway", "admin-api", "meeting-api", "runtime", "bot"]

  # The chart goes LAST on purpose: consumers anchor on the newest chart tag, so a chart
  # tag existing means every image of that commit is already pushed. The logic lives in
  # deploy/acr/push-chart.sh because ACB substitutes $-aliases in this file, which mangles
  # inline shell variables.
  - id: chart
    entryPoint: sh
    cmd: alpine/helm:3.16.2 deploy/acr/push-chart.sh {{.Run.Registry}} {{.Run.Commit}} {{.Values.channel}}
    when: ["push-images"]
