# Multi-step ACR task definition: the registry that watches this repo builds these five
# images (plus the join-env base) and the Helm chart from every push to jana-pilot.
# The task itself is created by jana-aickova's scripts/setup_vexa_acr_task.sh; this file
# owns WHAT gets built, that script owns WHICH registry watches the repo.
#
# {{.Run.Registry}} is the registry running the task. The branch and commit that name every
# tag come from --set rather than {{.Run.*}}, because .Run.Commit is populated only when the
# source context is a git URL: a branch built by hand from a local checkout, to witness it on
# a cluster before it is pushed anywhere, has no commit for ACB to read. Both are REQUIRED —
# an unset value renders empty and would silently produce tags like `vexa-bot:-`:
#
#   az acr run --registry <acr> --file acb.yaml --platform linux/amd64 \
#     --set branch=<branch> --set commit=$(git rev-parse HEAD) .
#
# Build contexts mirror deploy/compose/docker-compose.yml: meeting-api and the bot need
# the repo root (workspace installs), the rest build from their own directory.
version: v1.1.0
steps:
  # The ACR builder has no BuildKit, so RUN --mount=type=cache lines fail outright.
  # Strip the flag (losing only build-time caching) and fail loudly if any survive.
  - id: strip-cache-mounts
    entryPoint: sh
    cmd: >-
      bash:5 -c "set -e;
      grep -rl -- '--mount=type=cache' core --include='Dockerfile*' | xargs -r sed -i 's/RUN --mount=type=cache[^ ]* /RUN /';
      ! grep -rq -- '--mount=type=cache' core --include='Dockerfile*'"

  # The bot's Dockerfile says FROM vexa/meet-join-env:dev; building the base first on the
  # same docker state makes that resolve locally, exactly like deploy/compose/Makefile.
  - id: join-env
    build: -f core/meetings/modules/join/Dockerfile.env -t vexa/meet-join-env:dev core/meetings/modules/join
    when: ["strip-cache-mounts"]

  - id: gateway
    build: >-
      -f core/gateway/services/gateway/Dockerfile
      -t {{.Run.Registry}}/vexa-gateway:{{.Values.branch}}
      -t {{.Run.Registry}}/vexa-gateway:{{.Values.branch}}-{{.Values.commit}}
      core/gateway/services/gateway
    when: ["strip-cache-mounts"]
  - id: admin-api
    build: >-
      -f core/identity/services/admin-api/Dockerfile
      -t {{.Run.Registry}}/vexa-admin-api:{{.Values.branch}}
      -t {{.Run.Registry}}/vexa-admin-api:{{.Values.branch}}-{{.Values.commit}}
      core/identity/services/admin-api
    when: ["strip-cache-mounts"]
  - id: meeting-api
    build: >-
      -f core/meetings/services/meeting-api/Dockerfile
      -t {{.Run.Registry}}/vexa-meeting-api:{{.Values.branch}}
      -t {{.Run.Registry}}/vexa-meeting-api:{{.Values.branch}}-{{.Values.commit}}
      .
    when: ["strip-cache-mounts"]
  - id: runtime
    build: >-
      -f core/runtime/Dockerfile
      -t {{.Run.Registry}}/vexa-runtime:{{.Values.branch}}
      -t {{.Run.Registry}}/vexa-runtime:{{.Values.branch}}-{{.Values.commit}}
      core/runtime
    when: ["strip-cache-mounts"]
  - id: bot
    build: >-
      -f core/meetings/services/bot/Dockerfile
      --build-arg VEXA_IMAGE_VERSION={{.Values.commit}}
      -t {{.Run.Registry}}/vexa-bot:{{.Values.branch}}
      -t {{.Run.Registry}}/vexa-bot:{{.Values.branch}}-{{.Values.commit}}
      .
    when: ["join-env"]

  - id: push-images
    push:
      - "{{.Run.Registry}}/vexa-gateway:{{.Values.branch}}"
      - "{{.Run.Registry}}/vexa-gateway:{{.Values.branch}}-{{.Values.commit}}"
      - "{{.Run.Registry}}/vexa-admin-api:{{.Values.branch}}"
      - "{{.Run.Registry}}/vexa-admin-api:{{.Values.branch}}-{{.Values.commit}}"
      - "{{.Run.Registry}}/vexa-meeting-api:{{.Values.branch}}"
      - "{{.Run.Registry}}/vexa-meeting-api:{{.Values.branch}}-{{.Values.commit}}"
      - "{{.Run.Registry}}/vexa-runtime:{{.Values.branch}}"
      - "{{.Run.Registry}}/vexa-runtime:{{.Values.branch}}-{{.Values.commit}}"
      - "{{.Run.Registry}}/vexa-bot:{{.Values.branch}}"
      - "{{.Run.Registry}}/vexa-bot:{{.Values.branch}}-{{.Values.commit}}"
    when: ["gateway", "admin-api", "meeting-api", "runtime", "bot"]

  # The chart goes LAST on purpose: consumers anchor on the newest chart tag, so a chart
  # tag existing means every image of that commit is already pushed. The logic lives in
  # deploy/acr/push-chart.sh because ACB substitutes $-aliases in this file, which mangles
  # inline shell variables.
  - id: chart
    entryPoint: sh
    cmd: alpine/helm:3.16.2 deploy/acr/push-chart.sh {{.Run.Registry}} {{.Values.commit}} {{.Values.branch}}
    when: ["push-images"]
