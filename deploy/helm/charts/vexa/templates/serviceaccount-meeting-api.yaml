{{- if and .Values.meetingApi.enabled .Values.meetingApi.serviceAccount.create }}
# meeting-api's own identity, so a workload-identity federation (or any other per-service grant)
# binds to meeting-api alone rather than to the namespace default ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "meetingApi.serviceAccount.name is required when serviceAccount.create is true" .Values.meetingApi.serviceAccount.name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  {{- with .Values.meetingApi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
